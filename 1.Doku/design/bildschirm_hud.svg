<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 972" width="1160" height="972"><rect x="0" y="0" width="1160" height="972" rx="0" fill="#F1EFE8" opacity="1.0"/><text x="56" y="32" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="-0.4" opacity="1.0">Fahrendes Register - das HUD</text><text x="56" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">kompromisslos nuechtern, deckend, riesig</text><clipPath id="phone"><rect x="56" y="66" width="411" height="866" rx="4"/></clipPath><g clip-path="url(#phone)"><g transform="translate(56,66)"><rect x="0" y="0" width="411" height="866" rx="0" fill="#F1EFE8" opacity="1.0"/><path d="M0,86.60000000000001 C123.3,17.32 205.5,190.52 411,103.92 L411,0 L0,0 Z" fill="#CCEAC3"/><path d="M0,536.92 C102.75,476.3 226.05,675.48 411,588.88 L411,866 L0,866 Z" fill="#CCEAC3" opacity="0.85"/><path d="M254.82,259.8 C328.8,285.78000000000003 353.46,363.71999999999997 411,346.40000000000003 L411,467.64000000000004 C345.24,476.3 304.14,381.04 254.82,363.71999999999997 Z" fill="#AAD3DF"/><rect x="26" y="381.04" width="22" height="15" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="73" y="444.04" width="31" height="21" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="120" y="507.04" width="40" height="27" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="167" y="414.16" width="22" height="33" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="214" y="477.16" width="31" height="15" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="261" y="384.28000000000003" width="40" height="21" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="308" y="447.28000000000003" width="22" height="27" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="34" y="510.28000000000003" width="31" height="33" rx="2" fill="#DFDDD5" opacity="1.0"/><rect x="81" y="417.40000000000003" width="40" height="15" rx="2" fill="#DFDDD5" opacity="1.0"/><path d="M0,259.8 C123.3,294.44 226.05,173.20000000000002 411,225.16" fill="none" stroke="#DCD8CE" stroke-width="9" stroke-linecap="round"/><path d="M73.98,0 C90.42,216.5 41.1,389.7 65.76,866" fill="none" stroke="#DCD8CE" stroke-width="9" stroke-linecap="round"/><path d="M0,675.48 C143.85,623.52 246.6,744.76 411,692.8000000000001" fill="none" stroke="#DCD8CE" stroke-width="9" stroke-linecap="round"/><path d="M0,259.8 C123.3,294.44 226.05,173.20000000000002 411,225.16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M73.98,0 C90.42,216.5 41.1,389.7 65.76,866" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M0,675.48 C143.85,623.52 246.6,744.76 411,692.8000000000001" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M205.5,866 C205.5,744.76 82.2,710.12 82.2,588.88 C82.2,467.64000000000004 312.36,467.64000000000004 312.36,346.40000000000003 C312.36,225.16 106.86,207.84 123.3,51.96" fill="none" stroke="#E5C16C" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M205.5,866 C205.5,744.76 82.2,710.12 82.2,588.88 C82.2,467.64000000000004 312.36,467.64000000000004 312.36,346.40000000000003 C312.36,225.16 106.86,207.84 123.3,51.96" fill="none" stroke="#FFE082" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M205.5,866 C205.5,744.76 82.2,710.12 82.2,588.88 C82.2,467.64000000000004 312.36,467.64000000000004 312.36,346.40000000000003 C312.36,225.16 106.86,207.84 123.3,51.96" fill="none" stroke="#0A1560" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M205.5,866 C205.5,744.76 82.2,710.12 82.2,588.88 C82.2,467.64000000000004 312.36,467.64000000000004 312.36,346.40000000000003 C312.36,225.16 106.86,207.84 123.3,51.96" fill="none" stroke="#2F4BFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205.5" cy="636.51" r="17" fill="#0A1560"/><circle cx="205.5" cy="636.51" r="15" fill="#FFFFFF"/><circle cx="205.5" cy="636.51" r="11" fill="#0A84FF"/><path d="M205.5,610.51 L196.5,625.51 L214.5,625.51 Z" fill="#0A84FF" stroke="#0A1560" stroke-width="2" stroke-linejoin="round"/><rect x="0" y="0" width="411" height="184" rx="0" fill="#0D1219" opacity="1.0"/><text x="16" y="28" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="start" letter-spacing="0" opacity="1.0">19:42</text><text x="395" y="28" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="end" letter-spacing="0" opacity="1.0">78 %</text><g transform="translate(12,62) scale(2.1666666666666665)" fill="none" stroke="#FFFFFF" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"><path d="M27,44 L27,25 L14,25" stroke-width="6.5"/><path d="M6,25 L18,15.5 L18,34.5 Z" fill="#FFFFFF" stroke="none"/></g><text x="128" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-1.5" opacity="1.0">450</text><text x="238" y="128" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0" opacity="1.0">m</text><text x="128" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#B9C3CF" text-anchor="start" letter-spacing="0" opacity="1.0">Passo di Gavia</text><line x1="307" y1="66" x2="307" y2="162" stroke="#232C3A" stroke-width="1"/><g transform="translate(323,74) scale(1.0833333333333333)" fill="none" stroke="#B9C3CF" stroke-width="6.0" stroke-linecap="round" stroke-linejoin="round"><path d="M18,44 L18,30 L30,18" stroke-width="6.5"/><path d="M38,10 L38,26 L23,26 Z" fill="#B9C3CF" stroke="none"/></g><text x="349" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="middle" letter-spacing="0" opacity="1.0">1,2 km</text><rect x="303" y="610" width="96" height="96" rx="16" fill="#FF7B7B" opacity="1.0"/><g transform="translate(331.0,638.0) scale(0.8333333333333334)" fill="none" stroke="#0D1219" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="22" height="22" rx="4" fill="#0D1219" stroke="none"/></g><rect x="315" y="514" width="84" height="84" rx="16" fill="#0D1219" opacity="0.94"/><rect x="315" y="514" width="84" height="84" rx="16" fill="none" stroke="#232C3A" stroke-width="1" opacity="1.0"/><g transform="translate(337.0,536.0) scale(0.8333333333333334)" fill="none" stroke="#FFFFFF" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="12"/><path d="M24,4 L24,10"/><path d="M24,38 L24,44"/><path d="M4,24 L10,24"/><path d="M38,24 L44,24"/><circle cx="24" cy="24" r="4.5" fill="#FFFFFF" stroke="none"/></g><rect x="315" y="418" width="84" height="84" rx="16" fill="#0D1219" opacity="0.94"/><rect x="315" y="418" width="84" height="84" rx="16" fill="none" stroke="#232C3A" stroke-width="1" opacity="1.0"/><g transform="translate(337.0,440.0) scale(0.8333333333333334)" fill="none" stroke="#FFFFFF" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"><path d="M10,19 L18,19 L27,11 L27,37 L18,29 L10,29 Z"/><path d="M33,18 A9,9 0 0 1 33,30"/></g><rect x="0.0" y="717" width="82.2" height="5" rx="0" fill="#8AA6FF" opacity="1.0"/><rect x="82.2" y="717" width="82.2" height="5" rx="0" fill="#A88CFF" opacity="1.0"/><rect x="164.4" y="717" width="82.2" height="5" rx="0" fill="#D080F0" opacity="1.0"/><rect x="246.60000000000002" y="717" width="82.2" height="5" rx="0" fill="#FF7ECB" opacity="1.0"/><rect x="328.8" y="717" width="82.2" height="5" rx="0" fill="#FF7A9E" opacity="1.0"/><rect x="0" y="722" width="411" height="144" rx="0" fill="#0D1219" opacity="1.0"/><text x="16" y="774" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-1" opacity="1.0">78</text><text x="16" y="796" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="start" letter-spacing="0" opacity="1.0">km/h</text><circle cx="106" cy="766" r="29" fill="#C0172B"/><circle cx="106" cy="766" r="22" fill="#FFFFFF"/><text x="106" y="774" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#14181F" text-anchor="middle" letter-spacing="0" opacity="1.0">60</text><line x1="152" y1="736" x2="152" y2="804" stroke="#232C3A" stroke-width="1"/><text x="170" y="774" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5" opacity="1.0">12,4</text><text x="170" y="796" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="start" letter-spacing="0" opacity="1.0">Rest km</text><line x1="272" y1="736" x2="272" y2="804" stroke="#232C3A" stroke-width="1"/><text x="290" y="774" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5" opacity="1.0">20:31</text><text x="290" y="796" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8B96A3" text-anchor="start" letter-spacing="0" opacity="1.0">Ankunft</text></g></g><rect x="56.5" y="66.5" width="410" height="865" rx="4" fill="none" stroke="#6B6558" stroke-width="1" opacity="1.0"/><circle cx="507" cy="67" r="4.5" fill="#2440D9"/><text x="523" y="72" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Manoeverleiste 140 dp, deckend</text><text x="523" y="91" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Kein Alpha. Bei 92 Prozent ueber einer weissen Nebenstrasse faellt</text><text x="523" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">HudMuted von 10,53:1 auf 8,65:1 und die Flaechenfarbe wandert mit</text><text x="523" y="125" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">der Karte. Der Blick auf ein Stueck Karte hinter der Leiste ist</text><text x="523" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">diesen Verlust nicht wert.</text><circle cx="507" cy="169" r="4.5" fill="#0F7A34"/><text x="523" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Distanz 56 sp</text><text x="523" y="193" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">33,9 Bogenminuten bei 650 mm Leseabstand. ISO 15008 verlangt 20,</text><text x="523" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">empfiehlt 25. Weiss auf HudSurface: 18,79:1.</text><circle cx="507" cy="237" r="4.5" fill="#0F7A34"/><text x="523" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Strassenname 20 sp in HudMuted</text><text x="523" y="261" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">10,53:1 - er wird in Fahrt gelesen, also gilt die 7:1-Regel.</text><circle cx="507" cy="288" r="4.5" fill="#2440D9"/><text x="523" y="293" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Vorschau des uebernaechsten Manoevers, 52 dp</text><text x="523" y="312" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Erst sie macht "links, dann sofort rechts" fahrbar. Durch eine</text><text x="523" y="329" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Haarlinie getrennt, nicht durch Abstand - Abstand kostet Breite.</text><circle cx="507" cy="356" r="4.5" fill="#2440D9"/><text x="523" y="361" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Stopp 96 dp, die uebrigen 84 dp</text><text x="523" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">84 dp sind 13,3 mm, schmaler als ein Handschuhfinger. Deshalb</text><text x="523" y="397" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">traegt der 12-dp-Totraum dazwischen die halbe Sicherheit: das</text><text x="523" y="414" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Raster wird 96 dp = 15,2 mm. Stopp ist groesser, damit er sich</text><text x="523" y="431" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">ohne Lesen des Symbols finden laesst.</text><circle cx="507" cy="458" r="4.5" fill="#B31D6B"/><text x="523" y="463" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Kurvigkeitsband, 5 dp</text><text x="523" y="482" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Das einzige Verspielte, das es ins HUD schafft: die naechsten</text><text x="523" y="499" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">fuenf Kilometer, eingefaerbt nach der Rampe. Keine Zahl, keine</text><text x="523" y="516" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Beschriftung, keine Animation.</text><circle cx="507" cy="543" r="4.5" fill="#B31D6B"/><text x="523" y="548" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Fussleiste: drei Werte, nicht vier</text><text x="523" y="567" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Vier Werte zu 34 sp brauchen ueber 420 dp; verfuegbar sind 379.</text><text x="523" y="584" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Tempo plus Schild 118, Rest 88, Ankunft 110, zwei Luecken 32 -</text><text x="523" y="601" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">zusammen 348. Die Kurvigkeit wandert deshalb in das Band.</text><circle cx="507" cy="628" r="4.5" fill="#2440D9"/><text x="523" y="633" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#14181F" text-anchor="start" letter-spacing="0" opacity="1.0">Beschriftungen 13 sp = 7,9 Bogenminuten</text><text x="523" y="652" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Bewusst unter der Schwelle. Eine Beschriftung wird einmal im</text><text x="523" y="669" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Stand gelernt und danach nie wieder gelesen; sie darf keine</text><text x="523" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="500" fill="#4F5A66" text-anchor="start" letter-spacing="0" opacity="1.0">Information tragen, nur einen Wert benennen.</text></svg>