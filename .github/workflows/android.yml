name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Core logic (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Compiles and tests the framework-free core - routing profiles, BRouter
      # integration, Kalman filter, map matching, turn-by-turn state machine -
      # straight out of app/src, without needing the Android SDK.
      - name: Run the logic verifier
        run: gradle --project-dir tools/verifier test --no-daemon

      - name: Upload logic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-report
          path: tools/verifier/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: App unit tests (Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Compiles the Compose UI and runs the app's own unit tests. The verifier
      # job above deliberately excludes everything Android - ui/, service/,
      # voice/, di/ - so without this job a Compose change that does not
      # compile ships green. Deliberately not `assembleDebug`: the APK job was
      # removed on purpose (commit bd91125), and compiling plus testing is what
      # catches mistakes, not packaging them.
      - name: Run the app unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

