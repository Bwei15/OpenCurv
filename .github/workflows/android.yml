name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Core logic (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Compiles and tests the framework-free core - routing profiles, BRouter
      # integration, Kalman filter, map matching, turn-by-turn state machine -
      # straight out of app/src, without needing the Android SDK.
      - name: Run the logic verifier
        run: gradle --project-dir tools/verifier test --no-daemon

      - name: Upload logic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-report
          path: tools/verifier/build/reports/tests/test
          if-no-files-found: ignore

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Report APK sizes
        run: |
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/*/*.apk; do
            printf -- "- \`%s\` — %s\n" "$(basename "$f")" \
              "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: opencurv-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/tests
          if-no-files-found: ignore
